name: telegram-tools
version: 0.0.0
description: "Unofficial Telegram tools for coding agents: chats, messages, received files and sends."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - telegram_account_read
  - telegram_chat_read
  - telegram_file_save
  - telegram_file_send
  - telegram_message_send
  - telegram_sync_add
  - telegram_sync_read
  - telegram_sync_remove
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
  state_dir:
    description: "Where every label's state lives; an absolute path, or one starting with ~. Defaults to $XDG_STATE_HOME/telegram-tools, or ~/.local/state/telegram-tools."
  download_dir:
    description: "Where received files are saved; an absolute path, or one starting with ~. Defaults to ~/Downloads/telegram-tools. Read by tools; no service restart needed."
  download_max_mb:
    type: int
    description: "The largest file a download takes, in MB; an integer from 1 to 2000, default 100. Read by tools; no service restart needed."
  send_dirs:
    type: list
    description: "The directories files may be sent from, besides the working directory; absolute paths, or ones starting with ~, without commas. Defaults to none. Read by tools; no service restart needed."
  keep_disappearing:
    type: bool
    description: Keeps disappearing and view-once messages for the user; off by default. Read by the sync service.
  channels:
    type: bool
    description: Lets the mirror list channels; off by default. Read by the sync service.
  language:
    description: The language of the approval card, such as ja. Defaults to Hermes's display language, else English.
